openapi: 3.0.0
info:
  title: Sistema Livro - Gestão de Usuários e Área Fiscal
  description: API para administração de usuários e acesso ao dashboard de produtividade dos fiscais.
  version: 1.0.0

paths:
  /area-fiscal:
    get:
      tags: [Fiscal]
      summary: Seleção de Fiscal
      description: Com fiscal.area.own, redireciona para a própria área. Com fiscal.area.all, lista todos os cadastros para consulta, inclusive inativos ou sem login. A consulta independe da permissão de receber novas denúncias.
      responses:
        '200':
          description: HTML da view 'users/select'.

  /area-fiscal/{id}:
    get:
      tags: [Fiscal]
      summary: Dashboard do Fiscal
      description: Exibe as denúncias atribuídas ao fiscal com suporte a paginação e filtro por status.
      parameters:
        - $ref: '#/components/parameters/userId'
        - in: query
          name: status
          schema:
            type: string
            default: ALL
          description: Filtra por slug de status (Ex: REGISTRADA, NOTIFICADA).
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Dashboard carregado com lista de denúncias e contadores de status.

components:
  parameters:
    userId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Usuário não encontrado.
    ServerError:
      description: Erro interno (geralmente renderiza a view 'error').

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        ativo: { type: boolean, default: true }
