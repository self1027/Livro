openapi: 3.0.0
info:
  title: Sistema Livro - Administração
  version: 1.1.0
  description: Acompanhamento das denúncias, filas de atenção e distribuição por fiscal.
paths:
  /admin:
    get:
      tags: [Administração]
      summary: Carregar painel administrativo
      description: Indicadores refletem os filtros gerais e o status atual. As filas filtram somente a lista paginada (25 registros) e suas exportações. Todos os anos são incluídos por padrão. Idade e inatividade são alertas de acompanhamento, não prazos legais.
      parameters:
        - {name: year, in: query, description: Ano do protocolo (omitido inclui todos os anos), schema: {type: integer}}
        - {name: start, in: query, description: Data inicial de registro em São Paulo, schema: {type: string, format: date}}
        - {name: end, in: query, description: Data final de registro inclusiva em São Paulo, schema: {type: string, format: date}}
        - {name: scope, in: query, schema: {type: string, enum: [all, open], default: all}}
        - {name: userId, in: query, description: ID do fiscal ou unassigned para denúncias sem fiscal, schema: {type: string}}
        - {name: bairro, in: query, description: Nome exato do bairro, schema: {type: string}}
        - {name: status, in: query, description: Slug de status cadastrado no banco, schema: {type: string}}
        - {name: registration_type, in: query, description: Slug de origem cadastrado no banco, schema: {type: string}}
        - {name: inactivityDays, in: query, description: Dias desde o último relatório ou desde o registro quando não há histórico, schema: {type: integer, enum: [7, 15, 30, 60], default: 30}}
        - {name: queue, in: query, schema: {type: string, enum: [unassigned, inactive, old, closed, open, progress, age0, age1, age2, age3]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: tab, in: query, schema: {type: string, enum: [overview, attendance], default: overview}}
      responses:
        '200':
          description: Painel ou configuração de atendimento renderizado.
          content:
            text/html:
              schema: {type: string}
        '400': {description: Data inicial posterior à data final.}
        '500': {description: Erro ao carregar os dados.}
  /admin/export/{format}:
    get:
      tags: [Administração]
      summary: Exportar as denúncias filtradas
      description: Aceita os mesmos filtros gerais e queue de /admin. Exporta todas as páginas da fila escolhida. O CSV contém a lista; o PDF contém indicadores dos filtros gerais e a lista da fila.
      parameters:
        - name: format
          in: path
          required: true
          schema: {type: string, enum: [csv, pdf]}
      responses:
        '200':
          description: Arquivo para download.
          content:
            text/csv:
              schema: {type: string}
            application/pdf:
              schema: {type: string, format: binary}
        '400': {description: Intervalo de datas inválido.}
        '404': {description: Formato não suportado.}
        '500': {description: Erro na exportação.}
  /admin/attendance:
    post:
      tags: [Administração]
      summary: Configurar atendimento de denúncias
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                weekdays:
                  type: array
                  items: {type: string, enum: [SEG, TER, QUA, QUI, SEX]}
                paused: {type: string, enum: [on]}
                module_disabled: {type: string, enum: [on], description: Desabilita o módulo na home e preserva os dias e a pausa configurados.}
      responses:
        '302': {description: Retorna à aba Atendimento com notice=saved ou notice=error.}
  /admin/catalogs:
    get:
      tags: [Administração]
      summary: Gerenciar status, origens de denúncias e bairros
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [status, sender, district], default: status}}
      responses:
        '200': {description: Cadastros e seletores de cor renderizados.}
        '503': {description: Não foi possível carregar os cadastros.}
  /admin/catalogs/{kind}:
    post:
      tags: [Administração]
      summary: Adicionar opção com slug automático
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [status, sender]}}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/CatalogInput'}
      responses:
        '302': {description: Opção adicionada; retorna ao cadastro.}
        '400': {description: Dados inválidos; apresenta o formulário preenchido.}
  /admin/catalogs/{kind}/{id}:
    post:
      tags: [Administração]
      summary: Editar nome, cores e classificação mantendo slug e código
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [status, sender]}}
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/CatalogInput'}
      responses:
        '302': {description: Opção atualizada; retorna ao cadastro.}
        '400': {description: Dados inválidos.}
        '404': {description: Opção não encontrada.}
  /admin/schedule:
    get:
      tags: [Administração]
      summary: Editar a escala no painel administrativo
      description: Abre o mês atual em São Paulo quando ano e mês são omitidos.
      parameters:
        - {name: ano, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
        - {name: mes, in: query, description: Mês de 0 a 11, schema: {type: integer, minimum: 0, maximum: 11}}
      responses:
        '200': {description: Escala com controles de edição.}
        '400': {description: Ano ou mês inválido.}
  /admin/schedule/week:
    post:
      tags: [Administração]
      summary: Configurar responsável e anotação de uma semana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [week_key, nome]
              properties:
                week_key: {type: string, example: '42-2026'}
                nome: {type: string, maxLength: 255}
                anotacao: {type: string, maxLength: 10000}
      responses:
        '200': {description: Semana atualizada.}
        '400': {description: Dados inválidos.}
  /admin/schedule/day:
    post:
      tags: [Administração]
      summary: Configurar alteração diária ou feriado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, tipo]
              properties:
                data: {type: string, format: date}
                tipo: {type: string, enum: [sobrescrito, feriado, remover]}
                nome: {type: string, maxLength: 255}
                anotacao: {type: string, maxLength: 10000}
      responses:
        '200': {description: Dia atualizado.}
        '400': {description: Dados inválidos.}
  /admin/access:
    get:
      tags: [Administração]
      summary: Gerenciar pessoas, acessos, cargos e permissões
      description: Exclusivo da autoridade máxima. Inclui cadastros sem conta, consulta do histórico, credenciais, situação, recuperação e auditoria. O recebimento é definido pela permissão denunciations.receive do cargo.
      parameters:
        - {name: user_id, in: query, schema: {type: integer}, description: Pré-seleciona um cadastro sem conta para criar acesso vinculado.}
      responses:
        '200': {description: Gestão unificada de usuários e acessos.}
        '403': {description: Exige autoridade máxima.}
  /admin/access/people/{id}:
    post:
      tags: [Administração]
      summary: Atualizar nome e situação de um cadastro existente
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name, _csrf]
              properties:
                name: {type: string, maxLength: 255}
                ativo: {type: string, enum: [on], description: Omitido desativa o cadastro e impede login e novas atribuições.}
                _csrf: {type: string}
      responses:
        '302': {description: Retorna à gestão unificada.}
        '400': {description: Alteração inválida ou tentativa de desativar a última Chefia.}
  /admin/access/accounts:
    post:
      tags: [Administração]
      summary: Criar acesso com novo cadastro ou vínculo a uma pessoa existente
      description: Campos name, username, password e role_id são obrigatórios. user_id vincula ao cadastro existente. enabled e ativo usam on para habilitar acesso e cadastro. O recebimento é definido pelo cargo, sem opção inspector individual. Exige autoridade máxima e CSRF para sessão web.
      responses:
        '302': {description: Acesso criado; exige troca da senha no primeiro login.}
        '400': {description: Dados inválidos ou username já utilizado.}
  /admin/access/accounts/{id}:
    post:
      tags: [Administração]
      summary: Salvar nome, username, cargo, acesso habilitado e cadastro ativo
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '302': {description: Alteração salva e sessões da conta encerradas.}
        '400': {description: Dados inválidos ou alteração deixaria o sistema sem Chefia ativa.}
  /admin/access/accounts/{id}/reset:
    post:
      tags: [Administração]
      summary: Definir senha temporária e exigir troca no próximo acesso
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '302': {description: Senha redefinida e sessões revogadas.}
        '400': {description: Senha inválida.}
  /admin/assignments:
    get:
      tags: [Administração]
      summary: Fila paginada de denúncias sem fiscal ou seleção de responsável
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: denunciaId, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Fila de 25 denúncias por página ou formulário de atribuição.}
        '404': {description: Denúncia não encontrada.}
  /admin/assignments/{denunciaId}:
    post:
      tags: [Administração]
      summary: Atribuir fiscal ativo à denúncia
      parameters:
        - {name: denunciaId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: integer, minimum: 1}
                redirectToShow: {type: string, enum: ['true']}
      responses:
        '302': {description: Retorna ao painel ou ao detalhe da denúncia com o resultado.}
components:
  schemas:
    CatalogInput:
      type: object
      required: [label, color, backgroundColor]
      properties:
        label: {type: string, maxLength: 120}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        backgroundColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        behavior: {type: string, description: Classificação dos status; classificações automáticas são preservadas.}
    AdminStats:
      type: object
      properties:
        total: {type: integer, description: Todas as denúncias nos filtros gerais.}
        open: {type: integer, description: Denúncias não finalizadas.}
        progress: {type: integer, description: Denúncias com status classificado como em andamento.}
        closed: {type: integer, description: Denúncias com status classificado como finalizado.}
        unassigned: {type: integer, description: Denúncias abertas sem fiscal.}
        inactive: {type: integer, description: Denúncias abertas sem relatório pelo intervalo escolhido.}
        old: {type: integer, description: Denúncias abertas há mais de 60 dias.}
