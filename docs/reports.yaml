openapi: 3.0.0
info:
  title: Sistema Livro - API de Denúncias e Relatórios
  description: Gestão do ciclo de vida de fiscalização, desde o registro da denúncia até os relatórios de campo.
  version: 1.0.0

paths:
  # --- MÓDULO DE DENÚNCIAS ---
  /denuncias:
    post:
      tags: [Denunciations]
      summary: Criar nova denúncia
      description: O autor do cadastro é definido pela identidade autenticada no servidor e não pode ser informado ou alterado pelo formulário. A edição usa permissões separadas para denúncias cadastradas pela própria pessoa e para todas as denúncias, independentemente do fiscal responsável.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DenunciationInput'
      responses:
        '302':
          description: Sucesso. Redireciona para a listagem.
        '400':
          $ref: '#/components/responses/BadRequest'

  /atribuir/{denunciaId}:
    post:
      tags: [Denunciations]
      summary: Atribuir fiscal à denúncia
      parameters:
        - $ref: '#/components/parameters/denunciationId'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                userId: { type: integer }
      responses:
        '302':
          description: Redireciona com o resultado da atribuição.

  # --- MÓDULO DE RELATÓRIOS (Reports) ---
  /denuncias/{id}/adicionar-relatorio:
    post:
      tags: [Reports]
      summary: Adicionar Histórico ou Mudança de Status
      description: |
        O sistema processa dois tipos de registros aqui:
        1. TEXTO: Relato livre do fiscal.
        2. STATUS_CHANGE: Gerado automaticamente se o campo 'status' for alterado.
        Texto assume sivisa_state pending quando omitido ou vazio (aceita pending, registered ou not_applicable). sivisa_protocol e sivisa_note aceitam listas correspondentes; observações podem ser salvas sem protocolo e não removem a pendência. O estado explícito registered exige ao menos um protocolo. Um protocolo só pode pertencer a um relatório. Mudança somente de status não cabe no SIVISA.
        Texto e mudança de status enviados juntos compartilham uma operação interna, gerada no servidor. No painel de atividade recente, somente o texto desse envio aparece; mudanças de status isoladas continuam aparecendo. Ambos os registros permanecem no histórico completo da denúncia.
      parameters:
        - $ref: '#/components/parameters/denunciationIdPath'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '302':
          description: Relatório adicionado. Redireciona para a denúncia.
        '404':
          $ref: '#/components/responses/NotFound'

  /relatorio/{id}/sivisa:
    get:
      tags: [Reports]
      summary: Gerenciar classificação e protocolos SIVISA do relatório
      parameters:
        - $ref: '#/components/parameters/reportId'
      responses:
        '200': {description: Formulário; exige reports.edit e autoria ou fiscal.all.}
        '403': {description: Sem permissão para editar este relatório.}
    post:
      tags: [Reports]
      summary: Salvar classificação e lista completa de protocolos SIVISA
      description: O primeiro protocolo remove a pendência; remover o último faz a pendência voltar, exceto quando marcado explicitamente como not_applicable. Duplicidade entre relatórios é bloqueada no banco.
      parameters:
        - $ref: '#/components/parameters/reportId'
      responses:
        '302': {description: Retorna ao formulário com confirmação.}
        '400': {description: Classificação inválida ou protocolo já vinculado.}
        '403': {description: Sem permissão de edição ou sem autoria.}
  /sivisa/pendencias:
    get:
      tags: [Reports]
      summary: Listar pendências SIVISA do autor autenticado
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: Lista de 25 pendências por página, independentemente do status atual da denúncia.}
  /relatorio/{id}/editar:
    post:
      tags: [Reports]
      summary: Editar um relatório existente
      description: Atualiza a descrição e pode sincronizar o novo status com a denúncia pai.
      parameters:
        - $ref: '#/components/parameters/reportId'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '302':
          description: Redireciona para a denúncia.

  /relatorio/{id}/deletar:
    post:
      tags: [Reports]
      summary: Remover um registro de histórico
      parameters:
        - $ref: '#/components/parameters/reportId'
      responses:
        '302':
          description: Registro removido.

components:
  parameters:
    denunciationIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    denunciationId:
      name: denunciaId
      in: path
      required: true
      schema: { type: integer }
    reportId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: Erro de validação ou dados obrigatórios ausentes.
    NotFound:
      description: O recurso (Denúncia ou Relatório) não foi encontrado.
    ServerError:
      description: Erro interno no processamento.

  schemas:
    DenunciationInput:
      type: object
      required: [title, description, endereco, numero, bairro]
      properties:
        title: { type: string }
        description: { type: string }
        endereco: { type: string }
        numero: { type: string }
        bairro: { type: string }
        registration_type: { type: string }

    ReportInput:
      type: object
      properties:
        sivisa_state:
          type: string
          enum: [pending, registered, not_applicable]
          description: Padrão pending quando omitido ou vazio; independente do status da denúncia.
        sivisa_protocol:
          type: array
          items: {type: string, maxLength: 64}
          description: Protocolos exclusivos deste relatório; pelo menos um quando registrado.
        sivisa_note:
          type: array
          items: {type: string, maxLength: 500}
          description: Observações na mesma ordem dos protocolos. Podem ser preenchidas sem protocolo, sem contar como registro SIVISA.
        description: 
          type: string
          description: Conteúdo textual da fiscalização.
        status: 
          type: string
          description: Novo status para a denúncia (gera log de mudança).
        user_id: 
          type: integer
          description: Somente no modo sem autenticação; com sessão, o autor vem da identidade autenticada.

    # Baseado no arquivo reportType.js
    ReportType:
      type: integer
      enum: [0, 1]
      description: "0: STATUS_CHANGE, 1: TEXT"
